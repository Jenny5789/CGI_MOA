# web 컨테이너의 nginx 설정: 화면 파일 제공 + /api 를 backend 로 전달
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 사진 업로드 상한: 백엔드 MAX_UPLOAD_BYTES 가 10MB 이므로 여유를 둠 (nginx 기본 1MB 는 업로드가 막힘)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # docker 내부 이름 풀이: 요청할 때 backend 주소를 찾으므로 backend 를 다시 켜도 nginx 가 멈추지 않음
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 추출 첫 호출은 모델 준비로 오래 걸릴 수 있음 (13.9초 확인), 여유 있게
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 화면 주소 (BrowserRouter): 파일이 없는 주소는 index.html 을 돌려줘야 새로고침해도 열림
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 매번 새로 받게 함 (빌드마다 가리키는 파일 이름이 바뀜)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
